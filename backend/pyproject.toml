[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapseos"
version = "0.1.0"
description = "SynapseOS — self-learning AI system with RAG memory, feedback-driven reinforcement and human-in-the-loop safety"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.scripts]
synapseos = "synapseos.cli:main"

[tool.setuptools.packages.find]
include = ["synapseos*"]
